[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pvc-u"
version = "1.0.0"
description = "Protocolo de Validación Continua Universal — Kernel de gobernanza para Empresas de IA Autónomas"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Pedro Belentani", email = "belentani7@gmail.com"},
]
keywords = ["ai", "validation", "governance", "llm", "enterprise", "hipaa", "pci-dss", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "litellm>=1.15.0",
    "aiohttp>=3.9.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
postgres = [
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
pvcu = "pvc_u.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
